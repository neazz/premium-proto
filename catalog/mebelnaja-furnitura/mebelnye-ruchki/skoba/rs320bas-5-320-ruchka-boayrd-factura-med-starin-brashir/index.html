:root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#18181b;background:#f4f4f5}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;box-sizing:border-box}
.gate{visibility:hidden;width:100%;max-width:360px;background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:28px 24px;box-sizing:border-box;box-shadow:0 1px 2px rgb(0 0 0/.04)}

button{margin-top:16px;width:100%;height:40px;border:0;border-radius:8px;background:#18181b;color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
button:hover{background:#3f3f46}
button:disabled{opacity:.6;cursor:default}
.error{margin:12px 0 0;font-size:14px;color:#b91c1c}
.error:empty{display:none}
